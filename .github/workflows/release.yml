name: Release

# Shown in the Actions list instead of a bare "Release" — carries the version + channel.
run-name: "Tinycast ${{ inputs.version }} · ${{ inputs.channel }} #${{ github.run_number }}"

# Manually triggered from the Actions tab. Pick a channel and a base version;
# beta builds get an auto-incrementing suffix so re-running never collides.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options: [beta, stable]
        default: beta
      version:
        description: "Base version, e.g. 0.2.0 (no channel suffix)"
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 26.x found on this runner. Installed Xcodes:"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Using $XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - name: Compute release metadata
        id: meta
        run: |
          CHANNEL="${{ github.event.inputs.channel }}"
          BASE_VERSION="${{ github.event.inputs.version }}"
          # Each channel is a distinct, side-by-side app: its own display name + bundle id.
          case "$CHANNEL" in
            beta)   SUFFIX="-beta.${GITHUB_RUN_NUMBER}";  DISPLAY="Tinycast Beta";  BUNDLE="com.tinycast.app.beta";  PRERELEASE=true ;;
            stable) SUFFIX="";                            DISPLAY="Tinycast";       BUNDLE="com.tinycast.app";       PRERELEASE=false ;;
          esac
          FULL="${BASE_VERSION}${SUFFIX}"
          {
            echo "full_version=${FULL}"
            echo "display_name=${DISPLAY}"
            echo "bundle_id=${BUNDLE}"
            echo "dmg_file=Tinycast-${FULL}.dmg"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      # Fail fast before touching keychain crypto: signing secrets must be present.
      # The repo owner sets SIGNING_P12_BASE64 / SIGNING_P12_PASSWORD (docs/signing.md §2).
      - name: Verify signing secrets
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "${P12_BASE64}" ] || [ -z "${P12_PASSWORD}" ]; then
            echo "::error::SIGNING_P12_BASE64 and/or SIGNING_P12_PASSWORD secret not set. \
          These repo secrets hold the stable self-signed signing identity (see docs/signing.md §2) \
          and are required for every release."
            exit 1
          fi
          if ! printf '%s' "${P12_BASE64}" | base64 --decode >/dev/null 2>/dev/null; then
            echo "::error::SIGNING_P12_BASE64 is not valid base64. Re-export the P12 as base64 per docs/signing.md §2."
            exit 1
          fi
          echo "Signing secrets present, base64 decodes cleanly."

      # Import the stable self-signed identity into a temp keychain so every release is signed with
      # the SAME cert — that constant signature is what keeps users' Accessibility (TCC) grant alive
      # across updates. Generate/rotate the secrets per docs/signing.md.
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KPW="$(openssl rand -base64 24)"
          echo "${P12_BASE64}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          IMPORT_OUTPUT="$(security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "${P12_PASSWORD}" -A -T /usr/bin/codesign 2>&1)"
          echo "$IMPORT_OUTPUT"
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          # The P12 secret contains only this identity; use its certificate fingerprint directly.
          CERT_PEM="$RUNNER_TEMP/signing-cert.pem"
          if ! openssl pkcs12 -legacy -in "$RUNNER_TEMP/cert.p12" -clcerts -nokeys \
            -passin "pass:${P12_PASSWORD}" -out "$CERT_PEM" 2>/dev/null; then
            openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -clcerts -nokeys \
              -passin "pass:${P12_PASSWORD}" -out "$CERT_PEM"
          fi
          security add-trusted-cert -d -r trustRoot -k "$KEYCHAIN" "$CERT_PEM"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          SIGNING_IDENTITY="$(openssl x509 -in "$CERT_PEM" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')"
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "::error::Could not read the signing certificate fingerprint from the imported P12."
            exit 1
          fi
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"

      # Xcode rejects an untrusted self-signed certificate during build-setting validation even
      # when it is present in the keychain. Build unsigned, then sign the finished bundle directly.
      - name: Build and sign app
        env:
          VERSION: ${{ steps.meta.outputs.full_version }}
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          BUNDLE_ID: ${{ steps.meta.outputs.bundle_id }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            PRODUCT_NAME="$DISPLAY_NAME" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/${DISPLAY_NAME}.app"
          codesign --force --keychain "$RUNNER_TEMP/signing.keychain-db" \
            --sign "$SIGNING_IDENTITY" --timestamp=none \
            --entitlements Tinycast/Tinycast.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      # Pack the .app + an /Applications symlink into a compressed DMG under dist/.
      - name: Package DMG
        env:
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          DMG_FILE: ${{ steps.meta.outputs.dmg_file }}
        run: |
          STAGE="$(mktemp -d)"
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release/${DISPLAY_NAME}.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p dist
          diskutil image create from "$STAGE" --format UDZO --volumeName "$DISPLAY_NAME" "dist/${DMG_FILE}"

      - uses: actions/upload-artifact@v7
        with:
          name: Tinycast-${{ steps.meta.outputs.full_version }}
          path: dist/${{ steps.meta.outputs.dmg_file }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.meta.outputs.full_version }}"
          PRERELEASE_FLAG=""
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          gh release create "$TAG" \
            "dist/${{ steps.meta.outputs.dmg_file }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.meta.outputs.display_name }} ${{ steps.meta.outputs.full_version }}" \
            --notes "**Channel:** ${{ github.event.inputs.channel }}
          **Version:** ${{ steps.meta.outputs.full_version }}
          **Bundle ID:** \`${{ steps.meta.outputs.bundle_id }}\`
          Built from [\`${GITHUB_SHA:0:7}\`](${REPO_URL}/commit/${GITHUB_SHA}).

          ### Install

          Download **\`${{ steps.meta.outputs.dmg_file }}\`** from the assets below, open it, and drag \`${{ steps.meta.outputs.display_name }}\` into /Applications.

          ### Self-signed app — Gatekeeper

          Tinycast is signed with a stable self-signed identity (not an Apple Developer ID), so macOS will refuse to open it on first launch. Clear the quarantine flag once after copying it out of the DMG:

          \`\`\`sh
          xattr -dr com.apple.quarantine \"/Applications/${{ steps.meta.outputs.display_name }}.app\"
          \`\`\`

          Then launch from the Applications folder, and grant **Accessibility** permission when prompted. The fixed \`${{ steps.meta.outputs.bundle_id }}\` identity keeps that grant alive across future updates from this repository." \
            $PRERELEASE_FLAG
