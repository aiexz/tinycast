name: Feature request
description: Suggest an idea
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What should it do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it belong in Tinycast?
      description: Tinycast stays small on purpose — quality over quantity. Tell us why this is worth its weight.
    validations:
      required: true
